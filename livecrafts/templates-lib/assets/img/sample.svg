<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Sample screenshot">
  <!--
    The picture used in previews, so a layout that is built around an image shows one instead of a gap.
    It ships with the plugin on purpose: no network call, nothing to go missing, and it is obviously a placeholder
    rather than a photograph someone might mistake for their own content. Neutral greys only, so it sits quietly
    next to any brand colour.
  -->
  <rect width="1200" height="900" fill="#eef1f5"/>
  <g transform="translate(90 110)">
    <rect x="0" y="0" width="1020" height="680" rx="22" fill="#ffffff" stroke="#dde3ea" stroke-width="2"/>
    <rect x="0" y="0" width="1020" height="56" rx="22" fill="#f6f8fb"/>
    <rect x="0" y="40" width="1020" height="16" fill="#f6f8fb"/>
    <line x1="0" y1="56" x2="1020" y2="56" stroke="#dde3ea" stroke-width="2"/>
    <circle cx="34" cy="28" r="7" fill="#d6dde6"/>
    <circle cx="58" cy="28" r="7" fill="#d6dde6"/>
    <circle cx="82" cy="28" r="7" fill="#d6dde6"/>
    <rect x="120" y="19" width="360" height="18" rx="9" fill="#e8edf3"/>

    <!-- a sidebar -->
    <rect x="28" y="88" width="210" height="564" rx="14" fill="#f6f8fb"/>
    <rect x="52" y="116" width="150" height="14" rx="7" fill="#dfe6ee"/>
    <rect x="52" y="150" width="120" height="12" rx="6" fill="#e8edf3"/>
    <rect x="52" y="180" width="140" height="12" rx="6" fill="#e8edf3"/>
    <rect x="52" y="210" width="104" height="12" rx="6" fill="#e8edf3"/>
    <rect x="52" y="240" width="132" height="12" rx="6" fill="#e8edf3"/>

    <!-- headings and copy -->
    <rect x="272" y="104" width="420" height="22" rx="11" fill="#d6dde6"/>
    <rect x="272" y="144" width="640" height="12" rx="6" fill="#e8edf3"/>
    <rect x="272" y="170" width="560" height="12" rx="6" fill="#e8edf3"/>

    <!-- three little cards -->
    <rect x="272" y="214" width="200" height="130" rx="14" fill="#f6f8fb" stroke="#e4eaf1" stroke-width="2"/>
    <rect x="492" y="214" width="200" height="130" rx="14" fill="#f6f8fb" stroke="#e4eaf1" stroke-width="2"/>
    <rect x="712" y="214" width="200" height="130" rx="14" fill="#f6f8fb" stroke="#e4eaf1" stroke-width="2"/>
    <rect x="296" y="240" width="60" height="12" rx="6" fill="#dfe6ee"/>
    <rect x="516" y="240" width="60" height="12" rx="6" fill="#dfe6ee"/>
    <rect x="736" y="240" width="60" height="12" rx="6" fill="#dfe6ee"/>
    <rect x="296" y="268" width="140" height="10" rx="5" fill="#e8edf3"/>
    <rect x="516" y="268" width="152" height="10" rx="5" fill="#e8edf3"/>
    <rect x="736" y="268" width="128" height="10" rx="5" fill="#e8edf3"/>

    <!-- a chart, so the shape reads as an application rather than an article -->
    <rect x="272" y="378" width="640" height="274" rx="14" fill="#f6f8fb" stroke="#e4eaf1" stroke-width="2"/>
    <rect x="312" y="556" width="56" height="56" rx="6" fill="#dfe6ee"/>
    <rect x="392" y="512" width="56" height="100" rx="6" fill="#dfe6ee"/>
    <rect x="472" y="470" width="56" height="142" rx="6" fill="#d2dae4"/>
    <rect x="552" y="500" width="56" height="112" rx="6" fill="#dfe6ee"/>
    <rect x="632" y="438" width="56" height="174" rx="6" fill="#d2dae4"/>
    <rect x="712" y="476" width="56" height="136" rx="6" fill="#dfe6ee"/>
    <rect x="792" y="418" width="56" height="194" rx="6" fill="#c8d2de"/>
    <line x1="312" y1="612" x2="872" y2="612" stroke="#dde3ea" stroke-width="2"/>
  </g>
  <text x="600" y="846" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#9aa7b6">Sample image</text>
</svg>
