name: Checks

# Every push to a working branch and every pull request. staging and main run the same checks from release.yml
# before anything is published. Every error becomes an annotation (file, line, or the test's last lines), so it is
# readable on the run page without opening the log.
on:
  push:
    branches-ignore: [staging, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'   # the oldest PHP the plugin header promises ("Requires PHP: 7.4")
          coverage: none

      # The one check the development machine cannot do: it has no PHP.
      - name: PHP syntax (7.4)
        run: bash tools/ci/php-lint.sh

      # All tests run, even after one fails. The block test reads WordPress's own parser from a fresh download.
      - name: Offline tests (no database, no site)
        if: always()
        run: |
          curl -fsSL https://wordpress.org/latest.tar.gz | tar -xz -C "$RUNNER_TEMP"
          bash tools/ci/offline-tests.sh "$RUNNER_TEMP/wordpress"

  php-latest:
    # The newest PHP too: a host upgrading PHP must not break the plugin.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax (8.3)
        run: bash tools/ci/php-lint.sh

  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build the zip
        run: bash tools/build-zip.sh
      - uses: actions/upload-artifact@v5
        with:
          name: livecrafts-zip
          path: dist/*.zip
          if-no-files-found: error
